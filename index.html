<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>MediaPipe Face Tone Instrument</title>
    <link rel="stylesheet" href="styles.css">
  </head>
  <body>
    <header class="project-shell" aria-label="Project selector">
      <label>
        Project
        <select id="projectSelector">
          <option value="face-audio-instrument">Face Audio Instrument</option>
          <option value="ariadne">Ariadne</option>
          <option value="drawing">Drawing</option>
          <option value="word-bubbles">Word Bubbles</option>
        </select>
      </label>
    </header>
    <main class="app">
      <section class="stage">
        <video id="video" autoplay playsinline muted></video>
        <canvas id="overlay"></canvas>
        <div id="loading" class="loading">Loading MediaPipe...</div>
      </section>

      <section class="controls" aria-label="Instrument controls">
        <div class="header">
          <h1>Face Tone Instrument</h1>
          <p>Open your mouth to bend pitch. Open your eyes to raise volume.</p>
        </div>

        <div class="buttons">
          <button id="startButton" type="button" disabled>Start Camera + Audio</button>
          <button id="stopButton" type="button" disabled>Stop</button>
        </div>

        <div id="status" class="status">Waiting to start.</div>

        <div class="meter-grid">
          <label class="meter">
            <span>Mouth openness <strong id="mouthFrequencyLabel">20-2000 Hz</strong></span>
            <progress id="mouthOpenMeter" max="1" value="0"></progress>
            <output id="mouthOpenValue">0.00</output>
          </label>

          <label class="meter">
            <span>Eye openness <strong id="eyeFrequencyLabel">2000 Hz</strong></span>
            <progress id="eyeOpenMeter" max="1" value="0"></progress>
            <output id="eyeOpenValue">0.00</output>
          </label>

          <label class="meter">
            <span>Red pixel <strong id="redFrequencyLabel">1200 Hz</strong></span>
            <progress id="redPixelMeter" max="1" value="0"></progress>
            <output id="redPixelValue">0.00</output>
          </label>

          <label class="meter">
            <span>Square volume</span>
            <progress id="mouthVolumeMeter" max="1" value="0"></progress>
            <output id="mouthVolumeValue">0.00</output>
          </label>

          <label class="meter">
            <span>Eye tone volume</span>
            <progress id="eyeVolumeMeter" max="1" value="0"></progress>
            <output id="eyeVolumeValue">0.00</output>
          </label>

          <label class="meter">
            <span>Red tone volume</span>
            <progress id="redVolumeMeter" max="1" value="0"></progress>
            <output id="redVolumeValue">0.00</output>
          </label>
        </div>

        <details>
          <summary>Tuning</summary>
          <label>
            Mouth threshold
            <input id="mouthThreshold" type="range" min="0.05" max="0.5" step="0.01" value="0.18">
          </label>
          <label>
            Eye open threshold
            <input id="eyeOpenThreshold" type="range" min="0.08" max="0.35" step="0.01" value="0.21">
          </label>
          <label>
            Mouth pitch start <output id="mouthFrequencyValue">880 Hz</output>
            <input id="mouthFrequency" type="range" min="10" max="5000" step="1" value="880">
          </label>
          <label>
            Eye pitch <output id="eyeFrequencyValue">2000 Hz</output>
            <input id="eyeFrequency" type="range" min="10" max="5000" step="1" value="2000">
          </label>
          <label>
            Red pixel pitch <output id="redFrequencyValue">1200 Hz</output>
            <input id="redFrequency" type="range" min="10" max="5000" step="1" value="1200">
          </label>
          <label>
            Red decision point <output id="redDecisionValue">0.50</output>
            <input id="redDecision" type="range" min="0" max="1" step="0.01" value="0.5">
          </label>
          <label>
            Data delay <output id="delayValue">0.00 s</output>
            <input id="dataDelay" type="range" min="0" max="2" step="0.01" value="0">
          </label>
          <label class="checkbox-label">
            <input id="binaryAudio" type="checkbox">
            Binary audio response
          </label>
          <label class="checkbox-label">
            <input id="enableFaceAnalysis" type="checkbox" checked>
            Enable facial analysis
          </label>
          <label class="checkbox-label">
            <input id="enableHandAnalysis" type="checkbox" checked>
            Enable hand analysis
          </label>
          <label class="checkbox-label">
            <input id="showOverlay" type="checkbox" checked>
            Show landmark overlay
          </label>
          <label>
            Camera resolution <output id="resolutionValue">Full</output>
            <select id="cameraResolution">
              <option value="full">Full</option>
              <option value="half">Half</option>
              <option value="quarter">Quarter</option>
            </select>
          </label>
        </details>
      </section>
    </main>

    <script type="module" src="app.js?v=2026-05-28-word-bubbles-attached"></script>
  </body>
</html>
